<!doctype html><html lang="en"><meta charset="UTF-8"><title>AgentShield Deep Scan</title><link rel="stylesheet" href="popup.css"><body><header>◈ AgentShield <span>DEEP SCAN</span></header><p>Only selected text or a file you choose. No automatic inbox access.</p><label>Local AgentShield address<input id="base" value="http://127.0.0.1:5174"></label><label>Upload-only pairing token<input id="token" type="password" autocomplete="off"></label><div class="row"><button id="selection">Read selected text</button><button id="shield">Enable page shield</button></div><label>Or choose an invoice<input id="file" type="file" accept="application/pdf,image/png,image/jpeg"></label><label>Preview selected invoice text<textarea id="preview" rows="6" maxlength="20000" placeholder="Select only the invoice text you want to send."></textarea></label><label class="consent"><input id="consent" type="checkbox">I approve sending this selection/file to my paired local workspace.</label><button id="send" class="primary">Create private draft →</button><p id="status" role="status"></p><small>This credential cannot read invoices, run Muse/SAM, or authorize payments. Model scans require explicit actions in the app.</small><script src="popup.js"></script></body></html>
